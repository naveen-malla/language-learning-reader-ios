# Local production-like stack: Postgres + API in containers.
#   docker compose up --build        -> API on http://localhost:8000 (docs at /docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
      POSTGRES_DB: reader
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader"]
      interval: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://reader:reader@db:5432/reader
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      ALLOW_REGISTRATION: "true"
      ENVIRONMENT: local-docker
    ports: ["8000:8000"]

volumes:
  pgdata:
